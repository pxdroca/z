name: Poll Telegram listener

on:
  # Gatilho PRINCIPAL: um cron externo (cron-job.org) chama a API de
  # repository_dispatch do GitHub com este event_type. Motivo: o
  # agendador de `schedule` do GitHub é best-effort e nunca entregou os
  # 5 minutos configurados neste repositório — medido no histórico real,
  # os intervalos variaram de 8 a 32 min no melhor caso, e chegaram a
  # ficar 90 min sem disparar nenhuma vez. Como o pipeline serve
  # notificação de aposta ao vivo, esse atraso é o próprio problema.
  repository_dispatch:
    types: [poll-listener]

  # Mantido como REDE DE SEGURANÇA: se o serviço externo cair, o cron do
  # GitHub ainda dispara (irregular, mas melhor que nada). Não remover.
  schedule:
    # A cada 5 min — só é sustentável de graça porque este repositório é
    # público (Actions em repositório privado tem limite mensal de minutos
    # que essa cadência estouraria por causa do arredondamento de cobrança
    # do GitHub pra minuto cheio).
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    # 8 min, não 4: no primeiro poll de um grupo novo a janela de 30h traz
    # dezenas de mensagens, cada uma passando por OCR/LLM. Medido em
    # 05/09/2026: três polls seguidos foram CANCELADOS aos ~259s (o teto
    # de 4 min), enquanto os polls de rotina levavam ~125s.
    #
    # O ponteiro agora é gravado a cada mensagem (ver listener._poll_chat),
    # então um ciclo interrompido não perde mais o progresso — mas dar
    # margem evita ficar cancelando no meio de um lote grande.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forçar IPv4 (evita IPv6 sem rota no runner do GitHub Actions)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Poll new messages
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_SOURCE_CHAT: ${{ secrets.TELEGRAM_SOURCE_CHAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OCR_ENGINE: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Backup do Gemini quando ele devolve 503 ("high demand") — ver
          # extractor._extrair_com_fallbacks. Sem o secret, a cadeia segue
          # como antes (Gemini -> EasyOCR -> texto puro).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # O backup que cobre PRINT (o Groq só dá conta de tip de texto —
          # ver extractor._groq_cabe_no_limite).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS }}
          SUPERBET_BASE_URL: ${{ vars.SUPERBET_BASE_URL }}
          BETANO_BASE_URL: ${{ vars.BETANO_BASE_URL }}
          BETANO_TENNIS_PATH: ${{ vars.BETANO_TENNIS_PATH }}
          BET365_BASE_URL: ${{ vars.BET365_BASE_URL }}
          BET365_TENNIS_PATH: ${{ vars.BET365_TENNIS_PATH }}
          PLAYWRIGHT_HEADLESS: "true"
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python listener.py --poll-once
